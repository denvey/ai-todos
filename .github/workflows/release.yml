name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Prepare version
        id: version
        run: |
          version=$(node -p "JSON.parse(require('node:fs').readFileSync('package.json', 'utf8')).version")
          if ! git tag --points-at HEAD | grep -Fxq "v$version"; then
            npm version patch --no-git-tag-version
            node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs';
          const { version } = JSON.parse(readFileSync('package.json', 'utf8'));
          const manifest = JSON.parse(readFileSync('plugin.json', 'utf8'));
          manifest.version = version;
          writeFileSync('plugin.json', JSON.stringify(manifest, null, 2) + '\n');
          NODE
            version=$(node -p "JSON.parse(require('node:fs').readFileSync('package.json', 'utf8')).version")
          fi
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

      - name: Build portable plugin
        run: npm run package:plugin -- --portable

      - name: Check release versions
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { readFileSync } from 'node:fs';
          const read = path => JSON.parse(readFileSync(path, 'utf8'));
          const { version } = read('package.json');
          for (const path of ['plugin.json', 'package-lock.json', 'plugins/ai-todos/package.json', 'plugins/ai-todos/.codex-plugin/plugin.json']) {
            assert.equal(read(path).version, version, path);
          }
          assert.equal(read('package-lock.json').packages[''].version, version);
          assert.equal(read('plugins/ai-todos/mcp.json').mcpServers['ai-todos'].command, 'node');
          assert.equal(read('plugins/ai-todos/.mcp.json').mcpServers['ai-todos'].command, 'node');
          NODE

      - name: Commit release and push tag
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if git show-ref --verify --quiet "refs/tags/$TAG"; then
            if [ "$(git rev-parse HEAD)" != "$(git rev-parse "$TAG^{commit}")" ]; then
              echo "Tag $TAG already belongs to a different commit." >&2
              exit 1
            fi
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add package.json package-lock.json plugin.json plugins/ai-todos
            git commit -m "chore(release): $TAG"
            git tag "$TAG"
            git push --atomic origin HEAD:main "refs/tags/$TAG"
          fi

      - name: Archive plugin
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          tar -czf "ai-todos-$TAG.tar.gz" -C plugins ai-todos
          cd plugins
          zip -qr "../ai-todos-$TAG.zip" ai-todos

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" "ai-todos-$TAG.tar.gz" "ai-todos-$TAG.zip" --clobber
          else
            gh release create "$TAG" "ai-todos-$TAG.tar.gz" "ai-todos-$TAG.zip" --verify-tag --generate-notes --title "$TAG"
          fi
